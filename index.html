  bindRange('sp',function(x){S.sp=x;},function(x){return x.toFixed(1);});
  bindToggle('vec',function(x){S.vec=x;});bindToggle('grid',function(x){S.grid=x;});bindToggle('bub',function(x){S.bub=x;if(!x)bub=[];});
  $('#liq').addEventListener('change',function(){S.rl=+this.value;$('#rl').value=S.rl;$('#v_rl').textContent=S.rl;sfx('tap');});
  $('#bR').addEventListener('click',function(){reset();sfx('tap');});
  $('#bN').addEventListener('click',function(){S.V=Math.round((50+rnd()*450)/10)*10;S.rb=Math.round((200+rnd()*1800)/10)*10;
    var ls=[790,920,1000,1030,1200,1260];S.rl=ls[Math.floor(rnd()*6)];
    $('#V').value=S.V;$('#v_V').textContent=S.V;$('#rb').value=S.rb;$('#v_rb').textContent=S.rb;$('#rl').value=S.rl;$('#v_rl').textContent=S.rl;$('#liq').value=String(S.rl);reset();sfx('tap');});
  $('#bP').addEventListener('click',function(){png(C.cv,'arhimed.png');});
  function wave(x){return Math.sin(x*.55+t*1.7)*.16+Math.sin(x*.21-t*1.05)*.11;}
  function step(dt){
    var s=side(),Vm=S.V*1e-6,m=S.rb*Vm,f=Math.max(0,Math.min(1,(y+s/2)/s));
    var FA=S.rl*G*Vm*f,MG=m*G,a=(MG-FA)/m*100,k=2.2+8.5*f;
    v+=(a-k*v)*dt;y+=v*dt;
    var mx=WD-s/2-.4,mn=s/2-9.4;
    if(y>mx){y=mx;v=-v*.22;if(Math.abs(v)<.6)v=0;}
    if(y<mn){y=mn;if(v<0)v=0;}
    if(prevF<=.001&&f>.001&&v>7&&S.bub)for(var i=0;i<8;i++)bub.push({x:TW/2+(rnd()-.5)*s,y:SURF+.6+rnd()*2,r:.08+rnd()*.2,vy:2.5+rnd()*4});
    prevF=f;
    if(S.bub&&f>.05&&rnd()<.05)bub.push({x:TW/2+(rnd()-.5)*s,y:SURF+y+s/2-.2,r:.07+rnd()*.15,vy:2+rnd()*3});
    for(var b=bub.length-1;b>=0;b--){bub[b].y-=bub[b].vy*dt;if(bub[b].y<SURF+wave(bub[b].x))bub.splice(b,1);}
    if(bub.length>60)bub.splice(0,bub.length-60);
    t+=dt;
  }
  var uiT=0;
  activeSim={tick:function(now){
    if(!last)last=now;var dt=Math.min(.05,(now-last)/1000);last=now;
    acc+=dt*S.sp;var g=0;while(acc>=1/120&&g<40){step(1/120);acc-=1/120;g++;}if(acc>.5)acc=0;
    var W=C.W,H=C.H;ctx.clearRect(0,0,W,H);
    var sc=Math.min((W-26)/TW,(H-26)/TH),ox=(W-TW*sc)/2,oy=(H-TH*sc)/2;
    function X(c){return ox+c*sc;}function Y(c){return oy+c*sc;}
    var s=side(),f=Math.max(0,Math.min(1,(y+s/2)/s)),Vm=S.V*1e-6,FA=S.rl*G*Vm*f,MG=S.rb*Vm*G;
    ctx.save();rr(ctx,X(0),Y(0),TW*sc,TH*sc,10);ctx.fillStyle='rgba(8,20,14,.8)';ctx.fill();ctx.clip();
    var wp=new Path2D();wp.moveTo(X(0),Y(SURF+wave(0)));
    for(var x=0;x<=TW;x+=.5)wp.lineTo(X(x),Y(SURF+wave(x)));
    wp.lineTo(X(TW),Y(TH));wp.lineTo(X(0),Y(TH));wp.closePath();
    var gr=ctx.createLinearGradient(0,Y(SURF),0,Y(TH));
    gr.addColorStop(0,'rgba(53,214,192,.42)');gr.addColorStop(1,'rgba(20,80,70,.6)');
    ctx.fillStyle=gr;ctx.fill(wp);
    if(S.grid){ctx.strokeStyle='rgba(168,210,74,.16)';ctx.lineWidth=1;ctx.setLineDash([3,5]);
      for(var d=2;d<=WD;d+=2){ctx.beginPath();ctx.moveTo(X(1.6),Y(SURF+d));ctx.lineTo(X(TW-1),Y(SURF+d));ctx.stroke();}
      ctx.setLineDash([]);ctx.fillStyle='rgba(169,191,160,.85)';ctx.font='9px '+MONO;
      for(var d2=0;d2<=WD;d2+=4)ctx.fillText(String(d2),X(2.2),Y(SURF+d2)+3);}
    var px=X(TW/2-s/2),py=Y(SURF+y-s/2),ps=s*sc;
    var bg=ctx.createLinearGradient(px,py,px+ps,py+ps);bg.addColorStop(0,'#ece2cd');bg.addColorStop(1,'#8b9a86');
    ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=12;ctx.shadowOffsetY=4;
    rr(ctx,px,py,ps,ps,Math.min(7,ps*.16));ctx.fillStyle=bg;ctx.fill();ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.2;rr(ctx,px,py,ps,ps,Math.min(7,ps*.16));ctx.stroke();
    ctx.save();ctx.clip(wp);ctx.fillStyle='rgba(53,214,192,.26)';ctx.fillRect(X(0),Y(SURF-1),TW*sc,(TH-SURF+1)*sc);
    ctx.strokeStyle='rgba(210,255,240,.7)';ctx.lineWidth=1.1;
    for(var i=0;i<bub.length;i++){ctx.beginPath();ctx.arc(X(bub[i].x),Y(bub[i].y),Math.max(1,bub[i].r*sc),0,6.284);ctx.stroke();}
    ctx.restore();
    ctx.strokeStyle='rgba(200,255,235,.85)';ctx.lineWidth=2;ctx.beginPath();
    for(var wx=0;wx<=TW;wx+=.4){var wy=Y(SURF+wave(wx));if(wx===0)ctx.moveTo(X(wx),wy);else ctx.lineTo(X(wx),wy);}ctx.stroke();
    if(S.vec){var k=sc*.9,cx=X(TW/2),cy=Y(SURF+y);
      arrow(ctx,cx-1.3*sc,cy,cx-1.3*sc,cy-Math.min(8*sc,FA*k),'#8fe04a','F_A '+FA.toFixed(2));
      arrow(ctx,cx+1.3*sc,cy,cx+1.3*sc,cy+Math.min(8*sc,MG*k),'#ffb020','mg '+MG.toFixed(2));}
    ctx.restore();
    ctx.strokeStyle='rgba(168,210,74,.4)';ctx.lineWidth=1.6;rr(ctx,X(0),Y(0),TW*sc,TH*sc,10);ctx.stroke();
    var st=f>.995&&Math.abs(v)<1?'ТОНЕТ':(Math.abs(v)<.8&&f>.002&&f<.995?'ПЛАВАЕТ':'ДВИЖЕНИЕ');
    $('#hud').innerHTML='<span class="hchip">'+st+'</span><span class="hchip">'+Math.round(f*100)+' % ПОГРУЖЕНО</span>';
    uiT+=dt;if(uiT>.12){uiT=0;$('#oF').textContent=FA.toFixed(2);$('#oM').textContent=MG.toFixed(2);
      $('#oS').textContent=Math.round(f*100)+'%';$('#oW').textContent=(S.rb*Vm*1000).toFixed(0);}
  }};
  reset();
}

/* ---- МИТОЗ ---- */
function simMitosis(){
  var C=cvs(),ctx=C.ctx;
  var PH=['Интерфаза','Профаза','Метафаза','Анафаза','Телофаза','Цитокинез'];
  var SET=['2n4c','2n4c','2n4c','4n4c','2n2c','2n2c'];
  var S={p:1,play:true,sp:1,n:4,spindle:true,labels:true,env:true};
  var t=0,last=0;
  $('#panel').innerHTML='<div class="pt">УПРАВЛЕНИЕ ДЕЛЕНИЕМ</div>'+
    '<div class="ctl"><div class="lb"><span>Фаза</span></div><select id="ph">'+PH.map(function(p,i){return '<option value="'+i+'"'+(i===1?' selected':'')+'>'+p+'</option>';}).join('')+'</select></div>'+
    slider('sp','Скорость показа',0.2,2,0.1,1,'×')+
    '<div class="ctl"><div class="lb"><span>Число хромосом</span></div><select id="cn"><option value="2">2n = 2</option><option value="4" selected>2n = 4</option><option value="6">2n = 6</option></select></div>'+
    toggle('pl','Автопоказ',true)+toggle('sd','Веретено деления',true)+toggle('lb','Подписи',true)+toggle('en','Ядерная оболочка',true)+
    '<div class="reads"><div class="rd"><i>ФАЗА</i><b id="oP" style="font-size:11px">Профаза</b></div><div class="rd"><i>НАБОР</i><b id="oS">2n4c</b></div><div class="rd"><i>ХРОМОСОМ</i><b id="oC">4</b></div><div class="rd"><i>КЛЕТОК</i><b id="oK">1</b></div></div>'+
    '<div class="btns"><button id="bB">← Назад</button><button id="bF">Вперёд →</button><button class="p wide" id="bR">В начало</button><button class="wide" id="bP">Сохранить кадр</button></div>'+
    '<div class="simnote">Набор меняется только в анафазе: хроматиды расходятся и становятся хромосомами.</div>';
  function setP(i){S.p=(i+6)%6;$('#ph').value=String(S.p);}
  $('#ph').addEventListener('change',function(){S.p=+this.value;sfx('tap');});
  bindRange('sp',function(x){S.sp=x;},function(x){return x.toFixed(1);});
  $('#cn').addEventListener('change',function(){S.n=+this.value;sfx('tap');});
  bindToggle('pl',function(x){S.play=x;});bindToggle('sd',function(x){S.spindle=x;});
  bindToggle('lb',function(x){S.labels=x;});bindToggle('en',function(x){S.env=x;});
  $('#bB').addEventListener('click',function(){setP(S.p-1);sfx('tap');});
  $('#bF').addEventListener('click',function(){setP(S.p+1);sfx('tap');});
  $('#bR').addEventListener('click',function(){setP(0);t=0;sfx('tap');});
  $('#bP').addEventListener('click',function(){png(C.cv,'mitoz.png');});
  function chrom(cx,cy,size,split,col,ang){
    ctx.save();ctx.translate(cx,cy);ctx.rotate(ang||0);
    ctx.strokeStyle=col;ctx.lineWidth=Math.max(3,size*.22);ctx.lineCap='round';
    if(split){ctx.beginPath();ctx.moveTo(0,-size);ctx.lineTo(0,size);ctx.stroke();}
    else{ctx.beginPath();ctx.moveTo(-size*.5,-size);ctx.lineTo(-size*.12,0);ctx.lineTo(-size*.5,size);ctx.stroke();
      ctx.beginPath();ctx.moveTo(size*.5,-size);ctx.lineTo(size*.12,0);ctx.lineTo(size*.5,size);ctx.stroke();
      ctx.fillStyle='#f6f2e2';ctx.beginPath();ctx.arc(0,0,size*.16,0,6.284);ctx.fill();}
    ctx.restore();
  }
  activeSim={tick:function(now){
    if(!last)last=now;var dt=Math.min(.05,(now-last)/1000);last=now;
    t+=dt*S.sp;
    if(S.play&&t>2.6){t=0;setP(S.p+1);}
    var W=C.W,H=C.H;ctx.clearRect(0,0,W,H);
    var cx=W/2,cy=H/2,rx=Math.min(W*.4,180),ry=Math.min(H*.36,120);
    var p=S.p,n=S.n;
    var pinch=p===5?Math.min(1,t/2.6)*.55:0;
    ctx.save();
    ctx.beginPath();
    for(var a=0;a<=6.284;a+=.06){
      var fx=Math.cos(a),fy=Math.sin(a);
      var squeeze=1-pinch*Math.exp(-Math.pow(fx/.34,2));
      var X=cx+fx*rx,Y=cy+fy*ry*squeeze;
      if(a===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);
    }
    ctx.closePath();
    var gg=ctx.createRadialGradient(cx,cy-ry*.3,10,cx,cy,rx);
    gg.addColorStop(0,'rgba(168,210,74,.20)');gg.addColorStop(1,'rgba(40,80,45,.30)');
    ctx.fillStyle=gg;ctx.fill();ctx.strokeStyle='rgba(168,210,74,.7)';ctx.lineWidth=2.4;ctx.stroke();
    ctx.clip();
    var poleL=cx-rx*.82,poleR=cx+rx*.82;
    if(S.spindle&&p>=1&&p<=4){
      ctx.strokeStyle='rgba(53,214,192,.42)';ctx.lineWidth=1.1;
      for(var i=0;i<n;i++){
        var yy=cy+(i-(n-1)/2)*Math.min(26,ry*1.4/n);
        var sp=p===3?Math.min(1,t/2.2):0;
        var lx=p===3?cx-sp*rx*.55:cx,rxp=p===3?cx+sp*rx*.55:cx;
        ctx.beginPath();ctx.moveTo(poleL,cy);ctx.lineTo(p>=3?lx:cx,yy);ctx.stroke();
        ctx.beginPath();ctx.moveTo(poleR,cy);ctx.lineTo(p>=3?rxp:cx,yy);ctx.stroke();
      }
      ctx.fillStyle='#35d6c0';ctx.beginPath();ctx.arc(poleL,cy,4,0,6.284);ctx.fill();
      ctx.beginPath();ctx.arc(poleR,cy,4,0,6.284);ctx.fill();
    }
    var envA=(p===0||p>=4)?1:(p===1?Math.max(0,1-t/2):0);
    if(S.env&&envA>0.02){
      ctx.globalAlpha=envA;ctx.strokeStyle='rgba(214,240,125,.75)';ctx.lineWidth=2;ctx.setLineDash([5,4]);
      if(p>=4){var off=p===5?rx*.42:rx*.4;
        ctx.beginPath();ctx.ellipse(cx-off,cy,rx*.3,ry*.5,0,0,6.284);ctx.stroke();
        ctx.beginPath();ctx.ellipse(cx+off,cy,rx*.3,ry*.5,0,0,6.284);ctx.stroke();
      }else{ctx.beginPath();ctx.ellipse(cx,cy,rx*.46,ry*.62,0,0,6.284);ctx.stroke();}
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }
    var size=Math.min(15,ry*.24);
    for(var i2=0;i2<n;i2++){
      var yy2=cy+(i2-(n-1)/2)*Math.min(26,ry*1.4/n);
      var col=i2%2?'#ff6f9c':'#ffb020';
      if(p===0){chrom(cx+(i2-(n-1)/2)*18,cy+Math.sin(i2*2+t)*4,size*.8,false,'rgba(214,240,125,.55)',i2*.7);}
      else if(p===1){chrom(cx+(i2-(n-1)/2)*22,cy+(i2-(n-1)/2)*10,size,false,col,i2*.5+Math.sin(t)*.1);}
      else if(p===2){chrom(cx,yy2,size,false,col,0);}
      else if(p===3){var sp2=Math.min(1,t/2.2);chrom(cx-sp2*rx*.55,yy2,size*.9,true,col,0);chrom(cx+sp2*rx*.55,yy2,size*.9,true,col,0);}
      else{var off2=p===5?rx*.42:rx*.4;chrom(cx-off2,yy2*.55+cy*.45,size*.8,true,col,0);chrom(cx+off2,yy2*.55+cy*.45,size*.8,true,col,0);}
    }
    ctx.restore();
    if(S.labels){
      ctx.font='700 12px '+MONO;ctx.fillStyle='rgba(246,242,226,.9)';
      var txt=PH[p]+' · '+SET[p];ctx.fillText(txt,14,H-14);
      if(p===2){ctx.fillStyle='rgba(53,214,192,.9)';ctx.font='600 10px '+MONO;ctx.fillText('экватор клетки',cx-42,cy+ry*.85);}
    }
    $('#hud').innerHTML='<span class="hchip">'+PH[p].toUpperCase()+'</span><span class="hchip">'+SET[p]+'</span>';
    $('#oP').textContent=PH[p];$('#oS').textContent=SET[p];
    $('#oC').textContent=String(p===3?n*2:(p>=4?n:n));$('#oK').textContent=p===5?'2':'1';
  }};
}

    var root=$('#simRoot');

    for(var per=1;per<=4;per++)for(var gr=1;gr<=18;gr++){

      if(!e){cells+='<div></div>';continue;}

      '<div><h4>'+esc(e[2])+'</h4><div style="font-size:13px;color:var(--muted)">'+CATS[e[4]][0]+' · '+e[6]+'-й период, '+e[5]+'-я группа</div>'+
      '<div class="efacts"><div><i>АТ. МАССА</i><b>'+e[3]+'</b></div><div><i>ЭЛЕКТРОНЫ</i><b>'+e[9].join(', ')+'</b></div>'+
      '<div><i>ПЛАВЛЕНИЕ</i><b>'+e[7]+' K</b></div><div><i>КИПЕНИЕ</i><b>'+e[8]+' K</b></div>'+
      '<div><i>ПРИ '+S.T+' K</i><b style="color:'+STC[st]+'">'+stName+'</b></div></div></div></div>'+
      '</div><aside class="panel" style="max-height:none">'+
      '<div class="pt">УПРАВЛЕНИЕ ТАБЛИЦЕЙ</div>'+
      slider('T','Температура',1,3000,1,S.T,'K')+
      '<div class="ctl"><div class="lb"><span>Раскраска</span></div><select id="md"><option value="cat"'+(S.mode==='cat'?' selected':'')+'>По категориям</option><option value="state"'+(S.mode==='state'?' selected':'')+'>По агрегатному состоянию</option></select></div>'+
      '<div class="ctl"><div class="lb"><span>Поиск элемента</span></div><input type="text" id="eq" value="'+esc(S.q)+'" placeholder="железо или Fe" style="background:#0b1510;border:1px solid var(--line);color:var(--cream);border-radius:9px;padding:7px 9px;font:12.5px var(--sans);width:100%"></div>'+

      '<div class="reads"><div class="rd"><i>ЭЛЕМЕНТОВ</i><b>36</b></div><div class="rd"><i>ТЕМПЕРАТУРА</i><b>'+S.T+' K</b></div></div>'+

    $('#pn').addEventListener('click',function(){S.sel=ELEMENTS[Math.floor(Math.random()*ELEMENTS.length)][0];sfx('tap');render();});
    $('#p20').addEventListener('click',function(){S.T=293;sfx('tap');render();});
    $('#p0').addEventListener('click',function(){S.T=1;sfx('tap');render();});
    root.querySelectorAll('[data-el]').forEach(function(el){
      el.addEventListener('click',function(){S.sel=+this.dataset.el;sfx('tap');render();});
      el.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();S.sel=+this.dataset.el;sfx('tap');render();}});
    });
  }
  render();
  activeSim=null;
}

function parseHash(){
  var h=location.hash.replace(/^#\/?/,'');
  if(!h)return {v:'home'};
  var p=h.split('/');
  if(p[0]==='lesson'&&p[1]&&byId(p[1]))return {v:'lesson',id:p[1]};
  if(SUBJ[p[0]])return {v:'subject',s:p[0]};
  return {v:'home'};
}
function render(){
  destroySim();
  route=parseHash();
  var html='';
  if(searchQ.trim()){html=viewSearch(searchQ);}
  else if(route.v==='home')html=viewHome();
  else if(route.v==='subject')html=viewSubject(route.s);
  else{var l=byId(route.id);last=l.id;save();html=viewLesson(l);}
  app.innerHTML=html;
  updateHeader();reveal();
  if(!searchQ.trim()&&route.v==='lesson'){
    var l=byId(route.id);
    if(l.sim==='archimedes')simArchimedes();
    else if(l.sim==='mitosis')simMitosis();
    else if(l.sim==='periodic')simPeriodic();
    var qs=quizState[l.id];
    if(qs&&qs.answered)showFeedback(l,qs.correct,true);
  }
  window.scrollTo({top:0,behavior:'instant' in window?'instant':'auto'});
}
window.addEventListener('hashchange',function(){searchQ='';$('#q').value='';gradeF='all';render();sfx('open');});

/* ================= ПРОВЕРКА ================= */
function showFeedback(l,ok,silent){
  var fb=$('#fb');if(!fb)return;
  fb.className='fb show '+(ok?'ok':'no');
  fb.innerHTML=ok?'<b>Верно.</b> '+esc(l.q.why):'<b>Пока нет.</b> Перечитай теорию и попробуй ещё раз.';
  if(ok){
    document.querySelectorAll('#quiz .opt').forEach(function(o,i){
      var inp=o.querySelector('input');
      if(l.q.type==='choice'){if(i===l.q.c)o.classList.add('right');else if(inp.checked)o.classList.add('wrong');}
    });
    if(!progress[l.id]){progress[l.id]=true;save();updateHeader();}
    var lb=document.querySelector('[data-learn="'+l.id+'"]');
    if(lb){lb.className='btn done';lb.textContent='✓ Урок изучен';}
    if(!silent)sfx('ok');
  }else if(!silent){
    var q=$('#quiz');q.classList.remove('shake');void q.offsetWidth;q.classList.add('shake');sfx('no');
  }
}
function checkAnswer(id){
  var l=byId(id);initAudio();
  var qs=quizState[id]||(quizState[id]={});
  if(l.q.type==='choice'){
    var sel=document.querySelector('#quiz input[name="qz"]:checked');
    if(!sel){var fb=$('#fb');fb.className='fb show no';fb.textContent='Выбери один из вариантов.';sfx('no');return;}
    qs.answered=true;qs.correct=(+sel.value===l.q.c);
  }else{
    var raw=($('#numin').value||'').trim().toLowerCase().replace(/,/g,'.');
    raw=raw.replace(/\s*(н|n|кг|м|дж|вт|па|кпа|а|в|ом|см|моль|%|джоуль\w*|ньютон\w*)$/,'').trim();
    var val=parseFloat(raw);
    if(!isFinite(val)){var f2=$('#fb');f2.className='fb show no';f2.textContent='Введи число, например 2,94';sfx('no');return;}
    var exact=l.q.solve(),tol=Math.max(.005,Math.abs(exact)*.01);
    qs.answered=true;qs.correct=Math.abs(val-exact)<=tol;
  }
  showFeedback(l,qs.correct);
  if(qs.correct)toast('Правильно! Урок засчитан');
}

/* ================= ДЕЛЕГИРОВАНИЕ ================= */
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-link]');
  if(a){initAudio();sfx('open');if(a.getAttribute('href')===location.hash){e.preventDefault();searchQ='';$('#q').value='';render();}return;}
  var c=e.target.closest('[data-check]');if(c){checkAnswer(c.dataset.check);return;}
  var g=e.target.closest('[data-grade]');if(g){gradeF=g.dataset.grade;render();sfx('tap');return;}
  var ln=e.target.closest('[data-learn]');
  if(ln){initAudio();var id=ln.dataset.learn;
    if(progress[id]){delete progress[id];ln.className='btn p';ln.textContent='Отметить изученным';toast('Отметка снята');sfx('tap');}
    else{progress[id]=true;ln.className='btn done';ln.textContent='✓ Урок изучен';toast('Урок засчитан');sfx('done');}
    save();updateHeader();
    document.querySelectorAll('.navlist a').forEach(function(x){
      var lid=x.getAttribute('href').split('/').pop();
      x.classList.toggle('ok',!!progress[lid]);
      var n=x.querySelector('.n'),i=Array.prototype.indexOf.call(x.parentNode.children,x);
      n.textContent=progress[lid]?'✓':String(i+1).padStart(2,'0');
    });
    return;}
  var sr=e.target.closest('[data-simreset]');
  if(sr){var b=$('#bR')||$('#pr');if(b)b.click();return;}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='numin'){var l=byId(route.id);if(l)checkAnswer(l.id);}
  if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus();}
  if(e.key==='Escape'&&searchQ){searchQ='';$('#q').value='';render();}
});
var qTimer=null;
$('#q').addEventListener('input',function(){
  var v=this.value;clearTimeout(qTimer);
  qTimer=setTimeout(function(){searchQ=v;render();var f=$('#q');f.focus();},220);
});

/* ================= СТАРТ ================= */
render();
})();
</script>
</body>
</html>
